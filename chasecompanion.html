<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chase Companion Demo - Microsoft Copilot Integration</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            font-family: Arial, sans-serif;
            position: relative;
        }
        
        .background-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('chase-background.jpg'); /* Save the Chase screenshot with this filename */
            background-size: cover;
            background-position: top center;
            background-repeat: no-repeat;
            filter: brightness(0.95);
            z-index: -1;
        }
        
        .demo-disclaimer {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background-color: rgba(255, 0, 0, 0.8);
            color: white;
            text-align: center;
            padding: 8px;
            font-weight: bold;
            z-index: 100;
            font-size: 14px;
        }
        
        .chatbot-container {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 600px;
            max-height: 80vh;
            z-index: 10;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.3);
            border-radius: 10px;
            overflow: hidden;
        }
        
        /* Responsive adjustments */
        @media (max-width: 768px) {
            .chatbot-container {
                width: 90%;
                height: 60vh;
                right: 5%;
                bottom: 10px;
            }
        }
    </style>
</head>
<body>
    <div class="demo-disclaimer">
        DEMO ONLY - This is a demonstration of Microsoft Copilot integration and is not affiliated with Chase Bank
    </div>
    
    <div class="background-container"></div>
    
    <div class="chatbot-container">
        <iframe 
            src="https://copilotstudio.microsoft.com/environments/Default-fcd0e41c-f987-415f-b57d-824350b12b9d/bots/cr6bb_chaseCompanion/webchat?__version__=2" 
            frameborder="0" 
            style="width: 100%; height: 100%;">
        </iframe>
    </div>
</body>
</html>
